name: Apply chat lifecycle fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          ./gradlew :brain:test --no-daemon
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/com/sandbox/app/SandboxViewModel.kt .github/workflows/apply-chat-fixes-2.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: chat turn lifecycle"
          git push origin main