name: UI E2E

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-ui-e2e:
    name: Android UI E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm

      # A jornada Ed25519CompatibilityInstrumentedTest usa org.junit.Assume
      # para virar "skip" (não "fail") quando o provider JCA Ed25519 não
      # existe nesta imagem de emulador — isso é opcional e não é uma falha
      # do app. O código de saída real da task de teste nem sempre reflete
      # essa distinção com confiabilidade quando há skips misturados com
      # passes, então o pass/fail definitivo da jornada é decidido no passo
      # "Generate human-readable E2E report" a seguir, lendo o XML.
      - name: Run Android UI E2E on emulator
        id: ui-e2e-instrumentation
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Pbraincode.e2e.fakeRootfs=true -Pbraincode.e2e.offlineAi=true --no-daemon --stacktrace

      - name: Generate human-readable E2E report
        if: always()
        run: python3 scripts/generate_e2e_report.py

      - name: Publish E2E report to job summary
        if: always()
        run: cat e2e-report/BrainCode-E2E-Report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload UI E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BrainCode-ui-e2e-reports-${{ github.sha }}
          path: |
            **/build/outputs/androidTest-results/**
            **/build/reports/androidTests/**
            e2e-report/BrainCode-E2E-Report.md
          if-no-files-found: ignore
          retention-days: 14
