name: Apply prompt-domain and chat-turn fixes

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fixes
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          vm = Path('app/src/main/kotlin/com/sandbox/app/SandboxViewModel.kt')
          text = vm.read_text()
          start = text.index('    /** Regra estrutural: a conversa Android entra no Brain; nenhum executor local é chamado pelo chat. */')
          end = text.index('    /** Entrada única do composer Codex-style:', start)
          new_block = '''    /** Regra estrutural: cada turno do chat entra no Brain e sempre libera o estado no fim. */
    fun sendChatMessage() {
        val prompt = chatInput.trim()
        if (prompt.isEmpty()) return
        if (chatRunning) {
            chatMessages.add(ChatMessage(ChatRole.ERROR, "A tarefa anterior ainda está em execução. Aguarde a resposta antes de enviar outra solicitação."))
            return
        }
        chatMessages.add(ChatMessage(ChatRole.USER, prompt))
        chatInput = ""
        chatRunning = true
        appendThreadEvent(ThreadEvent.User(prompt))
        val resolved = resolveConversation(prompt)
        val objective = resolved.toBrainObjective()
        viewModelScope.launch {
            try {
                val response = withContext(Dispatchers.IO) {
                    runCatching {
                        val controller = brainController
                        if (controller != null && phase == SandboxPhase.Ready) {
                            val cycle = controller.executeObjective(objective, "chat-${System.currentTimeMillis()}") { passo ->
                                viewModelScope.launch(Dispatchers.Main.immediate) { publishStep(passo) }
                            }
                            val promptActionId = cycle.passos.firstOrNull { it.capacidade == "prompt.library.write" }?.actionId
                            val content = cycle.resposta ?: "Plano concluído: ${cycle.aprovado}"
                            val capability = cycle.passos.lastOrNull { it.resultado != null }?.capacidade
                            ChatMessage(ChatRole.ASSISTANT, content, promptActionId = promptActionId, contentType = detectGeneratedContentType(content, capability), researchSources = cycle.researchSources.map { it.toUiSource() })
                        } else {
                            ChatMessage(ChatRole.ASSISTANT, brainApiGateway.complete(objective).text)
                        }
                    }.getOrElse { ChatMessage(ChatRole.ERROR, "Brain não conseguiu responder: ${it.message ?: it.javaClass.simpleName}") }
                }
                chatMessages.add(response)
                appendThreadEvent(if (response.role == ChatRole.ASSISTANT) ThreadEvent.Agent(response.content, response.promptActionId, response.contentType, response.researchSources) else ThreadEvent.System(response.content))
            } finally {
                chatRunning = false
            }
        }
    }
'''
          text = text[:start] + new_block + text[end:]
          vm.write_text(text)

          workflow = Path('.github/workflows/apply-chat-fixes-2.yml')
          workflow.unlink(missing_ok=True)
          workflow.write_text('') if False else None
          PY

      - name: Verify source and tests
        run: |
          set -euo pipefail
          test -s app/src/main/kotlin/com/sandbox/app/SandboxViewModel.kt
          test ! -e .github/workflows/apply-chat-fixes-2.yml
          ./gradlew :brain:test --no-daemon

      - name: Commit and push source fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/com/sandbox/app/SandboxViewModel.kt .github/workflows/apply-chat-fixes-2.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "No source changes"; exit 0; }
          git commit -m "fix: image prompt classification and chat turn lifecycle"
          git push origin main
