name: Apply requested chat fixes 2

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply source fixes
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found: {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          vm = Path('app/src/main/kotlin/com/sandbox/app/SandboxViewModel.kt')
          replace_once(vm,
              '''    /** Regra estrutural: a conversa Android entra no Brain; nenhum executor local é chamado pelo chat. */\n    fun sendChatMessage() {\n        val prompt = chatInput.trim(); if (prompt.isEmpty() || chatRunning) return\n        chatMessages.add(ChatMessage(ChatRole.USER, prompt)); chatInput = ""; chatRunning = true\n        appendThreadEvent(ThreadEvent.User(prompt))\n        viewModelScope.launch {\n            val response = withContext(Dispatchers.IO) {\n                runCatching {\n                    val controller = brainController\n                    if (controller != null && phase == SandboxPhase.Ready) {\n                        val cycle = controller.executeObjective(prompt, "chat-${System.currentTimeMillis()}") { passo ->\n                            viewModelScope.launch(Dispatchers.Main.immediate) { publishStep(passo) }\n                        }\n                        ChatMessage(ChatRole.ASSISTANT, cycle.resposta ?: "Plano concluído: ${cycle.aprovado}")\n                    } else {\n                        ChatMessage(ChatRole.ASSISTANT, brainApiGateway.complete(prompt).text)\n                    }\n                }\n                    .getOrElse { ChatMessage(ChatRole.ERROR, "Brain não conseguiu responder: ${it.message ?: it.javaClass.simpleName}") }\n            }\n            chatMessages.add(response); chatRunning = false\n            appendThreadEvent(if (response.role == ChatRole.ASSISTANT) ThreadEvent.Agent(response.content) else ThreadEvent.System(response.content))\n        }\n    }''',
              '''    /** Monta o objetivo com as últimas mensagens do chat antes de enviá-lo ao Brain/Gateway. */\n    private fun buildChatObjective(currentPrompt: String): String {\n        val recent = chatMessages.takeLast(8)\n        if (recent.isEmpty()) return currentPrompt\n        val context = recent.joinToString("\\n") { message ->\n            val role = when (message.role) {\n                ChatRole.USER -> "Usuário"\n                ChatRole.ASSISTANT -> "Assistente"\n                ChatRole.ERROR -> "Erro"\n                ChatRole.STEP -> "Passo"\n            }\n            "$role: ${message.content}"\n        }\n        return "Conversa recente:\\n$context\\n\\nNova solicitação: $currentPrompt"\n    }\n\n    private fun hasApiKeyInCatalog(): Boolean =\n        apiProviders.any { provider -> apiKeyStore.get(provider.id)?.trim()?.isNotEmpty() == true }\n\n    /** Regra estrutural: a conversa Android entra no Brain; nenhum executor local é chamado pelo chat. */\n    fun sendChatMessage() {\n        val prompt = chatInput.trim(); if (prompt.isEmpty() || chatRunning) return\n        chatMessages.add(ChatMessage(ChatRole.USER, prompt)); chatInput = ""; chatRunning = true\n        appendThreadEvent(ThreadEvent.User(prompt))\n        val objective = buildChatObjective(prompt)\n        viewModelScope.launch {\n            val response = withContext(Dispatchers.IO) {\n                runCatching {\n                    val controller = brainController\n                    if (controller != null && phase == SandboxPhase.Ready) {\n                        val cycle = controller.executeObjective(objective, "chat-${System.currentTimeMillis()}") { passo ->\n                            viewModelScope.launch(Dispatchers.Main.immediate) { publishStep(passo) }\n                        }\n                        ChatMessage(ChatRole.ASSISTANT, cycle.resposta ?: "Plano concluído: ${cycle.aprovado}")\n                    } else {\n                        ChatMessage(ChatRole.ASSISTANT, brainApiGateway.complete(objective).text)\n                    }\n                }\n                    .getOrElse { ChatMessage(ChatRole.ERROR, "Brain não conseguiu responder: ${it.message ?: it.javaClass.simpleName}") }\n            }\n            chatMessages.add(response); chatRunning = false\n            appendThreadEvent(if (response.role == ChatRole.ASSISTANT) ThreadEvent.Agent(response.content) else ThreadEvent.System(response.content))\n        }\n    }''')
          replace_once(vm,
              '''                brainController = BrainSandboxController(\n                    prepared,\n                    File(dir, "rootfs"),''',
              '''                brainController = BrainSandboxController(\n                    prepared,\n                    File(dir, "rootfs"),\n                    apiKeyAvailable = { hasApiKeyInCatalog() },''')

          controller = Path('android-module/src/main/kotlin/com/sandbox/agent/BrainSandboxController.kt')
          replace_once(controller,
              '''    capabilityExecutors: Map<String, ActionExecutor> = emptyMap(),\n    private val events: EventStore = InMemoryEventStore()\n) {''',
              '''    capabilityExecutors: Map<String, ActionExecutor> = emptyMap(),\n    private val apiKeyAvailable: () -> Boolean = { true },\n    private val events: EventStore = InMemoryEventStore()\n) {''')
          replace_once(controller,
              '''        val classification = intentClassifier.classify(objective)\n        val planner = com.brain.planner.KeywordPlanner()\n        val basePlan = runBlockingPlanner { planner.planejar(classification.intent.objective) }''',
              '''        val classification = intentClassifier.classify(objective)\n        val planner = com.brain.planner.KeywordPlanner()\n        val basePlan = runBlockingPlanner { planner.planejar(classification.intent.objective) }\n        if (basePlan.passos.any { it.capacidade == "brain.analyze" } && !apiKeyAvailable()) {\n            throw IllegalStateException("Nenhuma chave de API válida está configurada no catálogo. Configure uma chave em Configurações antes de usar o diagnóstico por fallback.")\n        }''')

          thread = Path('app/src/main/kotlin/com/sandbox/app/ThreadScreen.kt')
          replace_once(thread,
              '''            LazyColumn(\n                state = listState,\n                modifier = Modifier.weight(1f).fillMaxWidth().padding(horizontal = 12.dp),\n                verticalArrangement = Arrangement.spacedBy(8.dp)\n            ) {\n                items(events) { event -> ThreadEventCard(event, viewModel) }\n            }''',
              '''            SelectionContainer {\n                LazyColumn(\n                    state = listState,\n                    modifier = Modifier.weight(1f).fillMaxWidth().padding(horizontal = 12.dp),\n                    verticalArrangement = Arrangement.spacedBy(8.dp)\n                ) {\n                    items(events) { event -> ThreadEventCard(event, viewModel) }\n                }\n            }''')
          replace_once(thread,
              '''                SelectionContainer {\n                    Text(event.text, style = MaterialTheme.typography.bodyMedium, modifier = Modifier.padding(horizontal = 14.dp, vertical = 10.dp))\n                }''',
              '''                Text(event.text, style = MaterialTheme.typography.bodyMedium, modifier = Modifier.padding(horizontal = 14.dp, vertical = 10.dp))''')
          replace_once(thread,
              '''                SelectionContainer {\n                    Text(event.text, style = MaterialTheme.typography.bodyMedium, modifier = Modifier.padding(horizontal = 4.dp, vertical = 8.dp))\n                }''',
              '''                Text(event.text, style = MaterialTheme.typography.bodyMedium, modifier = Modifier.padding(horizontal = 4.dp, vertical = 8.dp))''')
          replace_once(thread,
              '''                SelectionContainer { Text(event.body, fontFamily = if (event.title == "Git status") FontFamily.Monospace else FontFamily.Default, style = MaterialTheme.typography.bodySmall) }''',
              '''                Text(event.body, fontFamily = if (event.title == "Git status") FontFamily.Monospace else FontFamily.Default, style = MaterialTheme.typography.bodySmall)''')

          Path('.github/workflows/apply-chat-fixes.yml').unlink(missing_ok=True)
          Path('.github/workflows/apply-chat-fixes-2.yml').unlink()
          PY
      - name: Commit and push source fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/com/sandbox/app/SandboxViewModel.kt app/src/main/kotlin/com/sandbox/app/ThreadScreen.kt android-module/src/main/kotlin/com/sandbox/agent/BrainSandboxController.kt .github/workflows/apply-chat-fixes.yml .github/workflows/apply-chat-fixes-2.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "No source changes"; exit 0; }
          git commit -m "fix: chat context, API fallback and selection"
          git push origin main
