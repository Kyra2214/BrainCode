name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Tests + Android debug build
    runs-on: ubuntu-latest

    env:
      BRAINCODE_KEYSTORE_FILE: ${{ github.workspace }}/.ci/braincode-dev.jks
      BRAINCODE_KEYSTORE_PASSWORD: ${{ secrets.BRAINCODE_KEYSTORE_PASSWORD }}
      BRAINCODE_KEY_ALIAS: ${{ secrets.BRAINCODE_KEY_ALIAS }}
      BRAINCODE_KEY_PASSWORD: ${{ secrets.BRAINCODE_KEY_PASSWORD }}
      BRAINCODE_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore development signing key
        env:
          BRAINCODE_KEYSTORE_BASE64: ${{ secrets.BRAINCODE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .ci
          if [ -n "$BRAINCODE_KEYSTORE_BASE64" ] && [ -n "$BRAINCODE_KEYSTORE_PASSWORD" ] && [ -n "$BRAINCODE_KEY_ALIAS" ] && [ -n "$BRAINCODE_KEY_PASSWORD" ]; then
            printf '%s' "$BRAINCODE_KEYSTORE_BASE64" | base64 --decode > "$BRAINCODE_KEYSTORE_FILE"
            chmod 600 "$BRAINCODE_KEYSTORE_FILE"
            echo "Using configured CI development signing key"
          else
            echo "Signing secrets are not configured; refusing to publish an APK with an ephemeral debug keystore" >&2
            exit 1
          fi

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run all JVM/unit tests
        id: unit-tests
        continue-on-error: true
        run: ./gradlew :brain:test :android-module:test :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run Python regression tests
        run: python3 -m unittest discover -s tests

      - name: Run architecture gate
        run: ./scripts/architecture-gate.sh

      - name: Run documentation lint
        run: ./scripts/doc-lint.sh

      - name: List unreferenced production files
        run: ./scripts/orphan-check.py

      - name: Assemble Android debug APK
        if: always()
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify packaged Roofts and signing assets
        if: success()
        run: ./scripts/verify-apk-assets.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Run Android lint
        if: success()
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: BrainCode-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BrainCode-test-reports-${{ github.sha }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve test failure status
        if: steps.unit-tests.outcome == 'failure'
        run: exit 1

  release-readiness:
    name: Release readiness (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run release readiness preflight
        run: ./scripts/validate-release-readiness.sh

  security-scans:
    name: Local secret and SAST scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Semgrep CLI
        run: python3 -m pip install --user semgrep

      - name: Run Semgrep SAST
        continue-on-error: true
        run: |
          "$HOME/.local/bin/semgrep" scan --config auto --json --output semgrep-report.json --error

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BrainCode-semgrep-report-${{ github.sha }}
          path: semgrep-report.json
          if-no-files-found: ignore
          retention-days: 14
