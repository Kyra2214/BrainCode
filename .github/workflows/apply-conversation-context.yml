name: Apply conversation context migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace fixed 8-message context window
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/kotlin/com/sandbox/app/SandboxViewModel.kt')
          s = p.read_text()
          old = '''    /** Monta o objetivo com as últimas mensagens do chat antes de enviá-lo ao Brain/Gateway. */
    private fun buildChatObjective(currentPrompt: String): String {
        val recent = chatMessages.takeLast(8)
        if (recent.isEmpty()) return currentPrompt
        val context = recent.joinToString("\\n") { message ->
            val role = when (message.role) {
                ChatRole.USER -> "Usuário"
                ChatRole.ASSISTANT -> "Assistente"
                ChatRole.ERROR -> "Erro"
                ChatRole.STEP -> "Passo"
            }
            "$role: ${message.content}"
        }
        return "Conversa recente:\\n$context\\n\\nNova solicitação: $currentPrompt"
    }
'''
          new = '''    /**
     * Reconstrói o contexto da conversa inteira antes de enviar a nova solicitação ao Brain/Gateway.
     * Não existe mais uma janela fixa de N mensagens: sessões longas precisam preservar a ideia,
     * decisões e requisitos construídos ao longo de toda a conversa.
     */
    private fun buildChatObjective(currentPrompt: String): String {
        if (chatMessages.isEmpty()) return currentPrompt
        val context = chatMessages.joinToString("\\n") { message ->
            val role = when (message.role) {
                ChatRole.USER -> "Usuário"
                ChatRole.ASSISTANT -> "Assistente"
                ChatRole.ERROR -> "Erro"
                ChatRole.STEP -> "Passo"
            }
            "$role: ${message.content}"
        }
        return "Contexto completo da conversa:\\n$context\\n\\nNova solicitação: $currentPrompt"
    }
'''
          if old not in s:
              raise SystemExit('expected fixed-window block not found; aborting without changes')
          p.write_text(s.replace(old, new, 1))
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/kotlin/com/sandbox/app/SandboxViewModel.kt
          git commit -m 'feat: use full conversation context in chat brain' || exit 0
          git push
      - name: Remove migration workflow
        if: success()
        run: |
          git rm .github/workflows/apply-conversation-context.yml
          git commit -m 'chore: remove one-shot conversation migration workflow'
          git push
