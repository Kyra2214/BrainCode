name: Verify LFM2.5-350M model integrity

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify official GGUF SHA-256
        env:
          MODEL_URL: https://huggingface.co/LiquidAI/LFM2.5-350M-GGUF/resolve/main/LFM2.5-350M-Q4_K_M.gguf?download=true
          EXPECTED_SHA256: 7e6f72643caafc9a68256686638c4d7916f2cec76d1df478d4c3ddcd95a6aed4
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 --output model.gguf "$MODEL_URL"
          actual="$(sha256sum model.gguf | awk '{print $1}')"
          echo "expected=$EXPECTED_SHA256"
          echo "actual=$actual"
          test "$actual" = "$EXPECTED_SHA256"
          rm -f model.gguf

      - name: Bootstrap llama-android verification checksum
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          if [ ! -f gradle/verification-metadata.xml ]; then
            ./gradlew --write-verification-metadata sha256 :app:dependencies --no-daemon --stacktrace
            grep -n -A8 -B2 'dev.ffmpegkit-maintained' gradle/verification-metadata.xml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add gradle/verification-metadata.xml
            git commit -m 'chore: add Gradle dependency verification metadata'
            git push
          else
            ./gradlew :app:dependencies --no-daemon --stacktrace
            grep -n -A8 -B2 'dev.ffmpegkit-maintained' gradle/verification-metadata.xml
          fi
      - name: Upload generated verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: generated-gradle-verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 1
