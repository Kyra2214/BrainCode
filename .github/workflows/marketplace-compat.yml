name: Marketplace Compatibility

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ed25519-android:
    name: Ed25519 API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 33]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Run compatibility instrumentation
        id: ed25519-instrumentation
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          # O APK empacota as bibliotecas nativas do sandbox somente em arm64-v8a.
          # x86_64 falha antes do teste com INSTALL_FAILED_NO_MATCHING_ABIS.
          arch: arm64-v8a
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.sandbox.app.Ed25519CompatibilityInstrumentedTest --no-daemon --stacktrace

      # O teste usa org.junit.Assume para virar "skip" (não "fail") quando o
      # provider JCA Ed25519 não existe nesta imagem de emulador. O runner do
      # Gradle/AGP nem sempre propaga essa distinção de forma confiável no
      # código de saída da task quando ela é a única classe filtrada, então a
      # decisão real de pass/fail é feita aqui, lendo o XML de instrumentação.
      - name: Evaluate Ed25519 compatibility result
        if: always()
        env:
          BRAINCODE_API_LEVEL: ${{ matrix.api-level }}
        run: python3 scripts/check_ed25519_compat_result.py

      - name: Upload Ed25519 instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BrainCode-marketplace-compat-api${{ matrix.api-level }}-${{ github.sha }}
          path: |
            **/build/outputs/androidTest-results/connected/**
            **/build/reports/androidTests/**
          if-no-files-found: ignore
          retention-days: 14
